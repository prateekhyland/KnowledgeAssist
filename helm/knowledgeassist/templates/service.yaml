apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledgeassist.fullname" . }}-api
  labels:
    {{- include "knowledgeassist.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "knowledgeassist.fullname" . }}-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
