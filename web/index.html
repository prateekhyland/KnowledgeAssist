<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KnowledgeAssist</title>
  <style>
    :root { --brand:#2b6cb0; --bg:#f7fafc; --border:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:#1a202c; display:flex; flex-direction:column; height:100vh; }
    header { background:var(--brand); color:#fff; padding:14px 20px; font-size:18px; font-weight:600; }
    header small { font-weight:400; opacity:.85; margin-left:8px; font-size:13px; }
    #chat { flex:1; overflow-y:auto; padding:24px; max-width:900px; width:100%; margin:0 auto; }
    .msg { margin:0 0 16px; padding:12px 16px; border-radius:12px; line-height:1.55; }
    .user { background:var(--brand); color:#fff; margin-left:80px; }
    .bot { background:#fff; border:1px solid var(--border); margin-right:60px; }
    .bot pre { background:#1a202c; color:#e2e8f0; padding:12px; border-radius:8px; overflow-x:auto; }
    .bot code { background:#edf2f7; padding:1px 5px; border-radius:4px; }
    .bot pre code { background:none; padding:0; }
    .src { font-size:13px; color:#4a5568; margin-top:10px; border-top:1px dashed #cbd5e0; padding-top:8px; }
    .src a { color:var(--brand); text-decoration:none; }
    .typing { color:#718096; font-style:italic; }
    footer { border-top:1px solid var(--border); background:#fff; padding:12px; }
    .inbar { display:flex; max-width:900px; margin:0 auto; }
    #q { flex:1; border:1px solid #cbd5e0; border-radius:8px; padding:12px; font-size:15px; outline:none; }
    #send { margin-left:10px; background:var(--brand); color:#fff; border:none; border-radius:8px;
      padding:0 20px; font-size:15px; cursor:pointer; }
  </style>
</head>
<body>
  <header>KnowledgeAssist <small>API documentation assistant</small></header>
  <div id="chat"></div>
  <footer>
    <div class="inbar">
      <input id="q" type="text" placeholder="Ask about the API docs, or ask for a sample solution..." autofocus />
      <button id="send">Send</button>
    </div>
  </footer>

  <script>
    var API_BASE = window.location.origin;
    var chat = document.getElementById("q");
    var chatBox = document.getElementById("chat");
    var sendBtn = document.getElementById("send");

    fetch(API_BASE + "/config").then(function (r) { return r.json(); }).then(function (c) {
      if (c && c.app_name) {
        document.title = c.app_name;
        document.querySelector("header").firstChild.textContent = c.app_name + " ";
      }
    }).catch(function () {});

    addBot("Hi! I'm **KnowledgeAssist**. Ask me anything about the API docs, or ask me to " +
      "write a sample solution using the API.");

    sendBtn.onclick = send;
    chat.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });

    function send() {
      var q = chat.value.trim();
      if (!q) return;
      chat.value = "";
      addUser(q);
      var bot = addBot("");
      var content = bot.querySelector(".content");
      content.innerHTML = '<span class="typing">Thinking...</span>';
      var answer = "", sources = [];
      fetch(API_BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, stream: true })
      }).then(function (resp) {
        var reader = resp.body.getReader(), decoder = new TextDecoder(), buffer = "";
        function pump() {
          return reader.read().then(function (res) {
            if (res.done) { done(); return; }
            buffer += decoder.decode(res.value, { stream: true });
            var parts = buffer.split("\n\n"); buffer = parts.pop();
            parts.forEach(function (p) {
              var line = p.replace(/^data: /, "").trim();
              if (!line) return;
              var evt; try { evt = JSON.parse(line); } catch (e) { return; }
              if (evt.type === "sources") sources = evt.sources || [];
              else if (evt.type === "token") {
                answer += evt.text; content.innerHTML = md(answer);
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            });
            return pump();
          });
        }
        function done() {
          content.innerHTML = md(answer || "(no answer)");
          if (sources.length) bot.appendChild(renderSources(sources));
          chatBox.scrollTop = chatBox.scrollHeight;
        }
        return pump();
      }).catch(function (err) { content.textContent = "Error: " + err.message; });
    }

    function renderSources(sources) {
      var d = document.createElement("div"); d.className = "src";
      var html = "<strong>Sources</strong><br>";
      sources.forEach(function (s) {
        var label = s.title || s.url || ("source " + s.n);
        html += "[" + s.n + "] " + (s.url
          ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(label) + "</a>"
          : esc(label)) + "<br>";
      });
      d.innerHTML = html; return d;
    }
    function addUser(t) { return add("user", esc(t)); }
    function addBot(m) {
      var e = document.createElement("div"); e.className = "msg bot";
      e.innerHTML = '<div class="content">' + md(m) + "</div>";
      chatBox.appendChild(e); chatBox.scrollTop = chatBox.scrollHeight; return e;
    }
    function add(cls, html) {
      var e = document.createElement("div"); e.className = "msg " + cls;
      e.innerHTML = html; chatBox.appendChild(e); chatBox.scrollTop = chatBox.scrollHeight; return e;
    }
    function esc(s) {
      return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function md(text) {
      if (!text) return "";
      var cb = [];
      text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, function (_, l, code) {
        cb.push("<pre><code>" + esc(code) + "</code></pre>"); return "\u0000CB" + (cb.length - 1) + "\u0000";
      });
      text = esc(text);
      text = text.replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; });
      text = text.replace(/^#{1,6}\s+(.+)$/gm, "<strong>$1</strong>");
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
      text = text.replace(/\n/g, "<br>");
      text = text.replace(/\u0000CB(\d+)\u0000/g, function (_, i) { return cb[i]; });
      return text;
    }
  </script>
</body>
</html>
