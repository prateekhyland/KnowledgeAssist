apiVersion: batch/v1
kind: Job
metadata:
  name: knowledgeassist-ingest
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: knowledgeassist-ingest
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: REPLACE_IMAGE
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: knowledgeassist-env
          command: ["python", "-m", "ingest.index", "--sources", "/app/sources.yaml"]
          volumeMounts:
            - name: sources
              mountPath: /app/sources.yaml
              subPath: sources.yaml
      volumes:
        - name: sources
          configMap:
            name: knowledgeassist-sources
