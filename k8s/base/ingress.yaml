apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledgeassist-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
    - host: knowledgeassist.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knowledgeassist-api
                port:
                  number: 80
