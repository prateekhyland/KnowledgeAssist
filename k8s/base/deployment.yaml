apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgeassist-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledgeassist-api
  template:
    metadata:
      labels:
        app: knowledgeassist-api
    spec:
      containers:
        - name: api
          image: REPLACE_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: knowledgeassist-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
